<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visita al CAAC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600;800&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="extras.js"></script>
<script src="avatars.js"></script>
<script src="compositores.js"></script>
<script src="store.js"></script>
<script src="ranking.js"></script>
<style>
  /* Identidad: folleto del CAAC. Marino profundo, turquesa, verde Cartuja y el motivo escalonado del logo. */
  :root{--navy:#12233f;--navy2:#1b3358;--royal:#2b4fb8;--teal:#1fa5c8;--green:#16a35a;--lime:#39c27a;--amber:#f5b82e;--red:#e14b5e;
    --bg:#eef2f8;--card:#fff;--ink:#15213a;--muted:#5b6b86;--line:#dbe2ee;
    --head:"Space Grotesk",system-ui,sans-serif;--body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --o1:#e14b5e;--o2:#2b6fe0;--o3:#e8a917;--o4:#1f9d55;--o5:#8a4fd8;--o6:#f0742e}
  @media (prefers-color-scheme:dark){:root{--bg:#0a1324;--card:#13213a;--ink:#eaf0fb;--muted:#9fb1d0;--line:#243a5e;color-scheme:dark}}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 var(--body)}
  body{padding-top:env(safe-area-inset-top,0px)}
  .step{background:repeating-linear-gradient(90deg,var(--teal) 0 14px,transparent 14px 20px,var(--green) 20px 34px,transparent 34px 40px);height:5px}
  header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:9px 16px;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px #0003}
  header .brand{font-family:var(--head);font-weight:700;letter-spacing:.05em;font-size:14px;color:#9fd7e8}
  header .who{flex:1;display:flex;align-items:center;gap:8px;min-width:0;font-weight:600;font-size:15px}
  header .who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pts{background:var(--amber);color:#2b2000;font-weight:800;border-radius:14px;padding:4px 11px;font-size:14px;font-variant-numeric:tabular-nums}
  main{max-width:560px;margin:0 auto;padding:0 0 48px}
  .card{background:var(--card);border-radius:20px;padding:18px;margin:14px 16px;box-shadow:0 6px 24px #0f1c3a12}
  h1,h2{font-family:var(--head);text-wrap:balance;line-height:1.12}
  h1{font-size:30px;margin:0 0 6px}h2{font-size:24px;margin:8px 0 4px}
  h3{margin:14px 0 6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);font-family:var(--head)}
  .muted{color:var(--muted);font-size:15px}
  input{width:100%;padding:14px 16px;font:600 18px var(--body);border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
  input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px #1fa5c833}
  .btn{display:block;width:100%;padding:16px;border:0;border-radius:14px;font:800 17px var(--body);cursor:pointer;margin-top:12px;color:#fff;background:var(--teal);box-shadow:0 4px 0 #1685a3}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 #1685a3}
  .btn.green{background:var(--green);box-shadow:0 4px 0 #0f7a42}.btn.ghost{background:var(--line);color:var(--ink);box-shadow:none}.btn.navy{background:var(--navy2);box-shadow:0 4px 0 #0b1a33}
  .btn:disabled{opacity:.45;transform:none}
  /* hero de parada con foto */
  .hero{position:relative;margin:0 0 -22px;overflow:hidden;background:var(--navy2)}
  .hero img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
  .gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.gal::-webkit-scrollbar{display:none}.gal img{flex:0 0 100%;scroll-snap-align:start;width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
  .hero .ov{pointer-events:none}.hero .tx{pointer-events:none}
  .hero .ov{position:absolute;inset:0;background:linear-gradient(180deg,#0000 35%,#12233fdd 100%)}
  .hero .tx{position:absolute;left:16px;right:16px;bottom:30px;color:#fff}
  .hero .n{display:inline-block;background:var(--teal);color:#fff;font:700 12px var(--head);letter-spacing:.08em;padding:4px 10px;border-radius:8px;margin-bottom:6px}
  .hero h2{margin:0;font-size:26px;text-shadow:0 2px 8px #0008}
  /* avatares */
  .avpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px;margin-top:10px}
  .avpick button{position:relative;border:3px solid transparent;background:transparent;border-radius:50%;padding:0;cursor:pointer;line-height:0;transition:transform .12s}
  .avpick button:active{transform:scale(.92)}
  .avpick button[aria-checked="true"]{border-color:var(--teal);box-shadow:0 0 0 3px #1fa5c844}
  .avpick button.taken{opacity:.5;filter:grayscale(.85)}
  .avpick .lk{position:absolute;right:-4px;bottom:-4px;font-style:normal;font-size:15px;line-height:1}
  .avcard{display:flex;gap:14px;align-items:center;margin-top:14px;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:16px;padding:14px}
  .avcard .av{flex:none}
  .avcard b{font-family:var(--head);font-size:19px;display:block}
  .avcard small{color:#9fd7e8;display:block;margin-bottom:4px;font-weight:600}
  .avcard p{margin:0;font-size:14px;line-height:1.4;color:#dfe9f7}
  .big-av{display:flex;justify-content:center;margin:6px 0}
  .roster{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
  /* preguntas */
  .q{background:linear-gradient(135deg,var(--navy),var(--royal));color:#fff;border-radius:18px;padding:18px;font:700 20px/1.3 var(--head)}
  .opts{display:grid;gap:10px;margin-top:12px}
  .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border:0;border-radius:16px;color:#fff;font:700 17px/1.25 var(--body);cursor:pointer;box-shadow:0 4px 0 #0003;transition:transform .1s,filter .2s}
  .opt:active{transform:translateY(2px)}
  .opt .sh{width:30px;height:30px;flex:none;display:grid;place-items:center;font-size:20px;background:#ffffff33;border-radius:9px}
  .opt:disabled{cursor:default}.opt.dim{filter:grayscale(.7) brightness(.75);opacity:.6}
  .opt.ok{outline:4px solid #fff;filter:none;opacity:1}.opt.bad{outline:4px solid var(--red);filter:none;opacity:1}
  .study{background:linear-gradient(135deg,#ffd54a,#ff9f1c);color:#3a2500;border-radius:14px;padding:10px 14px;margin:0 0 10px;font:800 17px/1.25 var(--head);text-align:center;box-shadow:0 4px 0 #b36b00}
  .hint{background:#fff7d6;border:2px dashed #e8b923;color:#4a3a00;border-radius:12px;padding:10px 12px;margin-top:10px;font-size:15px}
  .timer{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:12px 0 2px}.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--amber));transition:width 1s linear}
  .result{text-align:center;padding:16px 0 4px}
  .result .big{font:800 52px var(--head);line-height:1;margin:6px 0}
  .result .ok{color:var(--green)}.result .no{color:var(--red)}
  /* ranking */
  .podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end;margin:14px 0 8px}
  .pod{text-align:center;background:var(--bg);border-radius:14px 14px 6px 6px;padding:10px 6px 8px}
  .pod .avw{display:flex;justify-content:center}
  .pod b{display:block;font-size:13px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pod small{color:var(--muted);font-variant-numeric:tabular-nums}
  .pod.p1{background:linear-gradient(180deg,#f5b82e55,var(--bg));padding-top:16px}.pod.p2{background:linear-gradient(180deg,#9fb1d055,var(--bg))}.pod.p3{background:linear-gradient(180deg,#c9843a55,var(--bg))}
  .rk{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px}
  .rk .pos{font:800 18px var(--head);width:28px;color:var(--muted)}
  .rk .sc{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums}
  .rk.me{background:#1fa5c822;outline:2px solid var(--teal)}
  .wave{display:flex;gap:5px;align-items:flex-end;height:44px;justify-content:center;margin:14px 0 6px}
  .wave i{width:7px;background:var(--teal);border-radius:4px;animation:w 1s infinite ease-in-out}
  .wave i:nth-child(2){animation-delay:.12s}.wave i:nth-child(3){animation-delay:.24s}.wave i:nth-child(4){animation-delay:.36s}.wave i:nth-child(5){animation-delay:.48s}.wave i:nth-child(6){animation-delay:.6s}
  @keyframes w{0%,100%{height:10px}50%{height:44px}}
  @media (prefers-reduced-motion:reduce){.wave i{animation:none;height:24px}}
  .center{text-align:center}
  .txt{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}.txt summary{cursor:pointer;font-weight:700;color:var(--teal);font-family:var(--head)}.txt p{margin:8px 0 0;line-height:1.55;font-size:16px}
  .tip{display:flex;gap:8px;align-items:flex-start;background:#f5b82e22;border:1px solid #f5b82e66;border-radius:12px;padding:10px 12px;font-size:14px;margin-top:12px}
  .dots{display:flex;gap:4px;justify-content:center;margin:8px 0}.dots i{width:8px;height:8px;border-radius:4px;background:var(--line)}.dots i.on{background:var(--teal);width:20px}.dots i.done{background:var(--green)}
</style>
</head>
<body>
<header><span class="brand">CAAC</span><div class="who" id="who"><span>Visita al monasterio</span></div><button id="mbtn" type="button" aria-label="Música" title="Música sí/no" style="border:0;background:#ffffff22;color:#fff;border-radius:12px;padding:4px 9px;font-size:16px;cursor:pointer">🎵</button><span class="pts" id="hPts" hidden>0</span></header>
<div class="step"></div>
<main id="main"></main>

<script>
const $=id=>document.getElementById(id), esc=U.esc, P=window.PARADAS;
const SLOT=new URLSearchParams(location.search).get("slot")||"", PKEY="caac_player"+SLOT;
let me=null; try{ me=JSON.parse(localStorage.getItem(PKEY)||"null"); }catch(e){}
let state=null, claims={}, players={}, myAnswers={}, duel=null, lastAudioSeq=null, pendingName="", pendingDoc=false, timerInt=null, sel=null;
const SHAPES=["▲","◆","●","■","★","⬟","⬢","✚"], OCOL=["var(--o1)","var(--o2)","var(--o3)","var(--o4)","var(--o5)","var(--o6)","#0e8f8f","#b5479a"];

// ---------- audio ----------
const canSpeak="speechSynthesis" in window;
let VOICE=null, curAudio=null, audioDone=false, audioPaused=false, lastCtlSeq=null, lastPhaseKey="", lastSig="";
// Elige la voz española más natural que tenga el móvil (las "Natural", "Enhanced", "Premium" o de Google suenan mucho mejor).
function pickVoice(){
  if(!canSpeak) return null;
  const vs=speechSynthesis.getVoices(); if(!vs.length) return null;
  const score=v=>{ let p=0; const n=(v.name||"").toLowerCase(), l=(v.lang||"").toLowerCase().replace("_","-");
    if(!l.startsWith("es")) return -1;
    if(l==="es-es") p+=40; else if(l==="es-mx"||l==="es-us"||l==="es-419") p+=20; else p+=10;
    if(/natural|neural|premium|enhanced|mejorad/.test(n)) p+=50;
    if(/google/.test(n)) p+=25;
    if(/m[oó]nica|elvira|alvaro|álvaro|jorge|paulina|marisol|laura|pablo|lucia|lucía|helena|sergio|conchita|esperanza/.test(n)) p+=15;
    if(/compact|espeak|eloquence/.test(n)) p-=40;
    if(v.localService===false) p+=5;
    return p; };
  return vs.map(v=>[score(v),v]).filter(x=>x[0]>=0).sort((a,b)=>b[0]-a[0]).map(x=>x[1])[0]||null;
}
if(canSpeak){ VOICE=pickVoice(); speechSynthesis.onvoiceschanged=()=>{ VOICE=pickVoice(); }; }
// Un único <audio> reutilizado: el móvil lo "desbloquea" con el primer toque y luego deja que suene cuando llega la orden del profesor.
const SILENT="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";
const AUD=new Audio(); AUD.preload="auto"; AUD.setAttribute("playsinline","");
let unlocked=false, pending=null;
function stopAll(){ if(canSpeak) speechSynthesis.cancel(); try{ AUD.pause(); }catch(e){} curAudio=null; audioPaused=false; }
function markDone(){ if(audioDone) return; audioDone=true; audioPaused=false; render(); }
// Lee por frases con pausas: la entonación queda más natural que de un tirón (solo si no hay mp3).
function speakTTS(text,onDone){
  if(!canSpeak){ if(onDone) onDone(); return; } speechSynthesis.cancel();
  const parts=text.replace(/\s+/g," ").match(/[^.!?…]+[.!?…]+["»”]?|[^.!?…]+$/g)||[text];
  let i=0;
  const next=()=>{ if(i>=parts.length){ if(onDone) onDone(); return; } const u=new SpeechSynthesisUtterance(parts[i++].trim());
    u.lang=(VOICE&&VOICE.lang)||"es-ES"; if(VOICE) u.voice=VOICE; u.rate=0.92; u.pitch=1.0; u.volume=1;
    u.onend=()=>setTimeout(next,260); u.onerror=()=>setTimeout(next,100); speechSynthesis.speak(u); };
  next();
}
function unlockAudio(){
  // Nunca tocar el <audio> si ya está sonando: cambiarle el src (aunque sea el silencio) lo cortaría.
  if(unlocked || curAudio===AUD || !AUD.paused) return;
  try{ AUD.src=SILENT; const pr=AUD.play(); if(pr&&pr.then) pr.then(()=>{ unlocked=true; if(curAudio!==AUD) AUD.pause(); hideBlocked(); if(pending){ const q=pending; pending=null; speak(q[0],q[1]); } }).catch(()=>{}); }catch(e){}
  if(canSpeak){ try{ const u=new SpeechSynthesisUtterance(" "); u.volume=0; speechSynthesis.speak(u);}catch(e){} }
  try{ if(navigator.wakeLock) navigator.wakeLock.request("screen").catch(()=>{}); }catch(e){}
}
["touchend","pointerdown","click","keydown"].forEach(ev=>document.addEventListener(ev,unlockAudio,{passive:true}));
document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ try{ if(navigator.wakeLock) navigator.wakeLock.request("screen").catch(()=>{}); }catch(e){} } });
function showBlocked(){
  let b=document.getElementById("blk");
  if(!b){ b=document.createElement("button"); b.id="blk"; b.type="button";
    b.style.cssText="position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;padding:16px;border:0;border-radius:14px;background:#e8b923;color:#1a1a1a;font:700 17px system-ui,sans-serif;box-shadow:0 8px 24px #0006";
    b.textContent="🔊 Toca aquí para oír el audio"; b.onclick=()=>{ unlockAudio(); const q=pending; pending=null; hideBlocked(); if(q) speak(q[0],q[1]); };
    document.body.appendChild(b); }
}
function hideBlocked(){ const b=document.getElementById("blk"); if(b) b.remove(); }
// Si existe audio/<id>.mp3 suena ese; si no, la voz del móvil.
function speak(text,id){
  stopAll(); hideBlocked(); audioDone=false; audioPaused=false;
  if(id){
    curAudio=AUD; AUD.onended=markDone;
    AUD.onerror=()=>{ if(curAudio===AUD){ curAudio=null; speakTTS(text,markDone); } };
    AUD.src="audio/"+id+".mp3"; AUD.currentTime=0;
    const pr=AUD.play();
    if(pr&&pr.then) pr.then(()=>{ unlocked=true; });
    if(pr&&pr.catch) pr.catch(err=>{ if(curAudio!==AUD) return;
      if(err&&err.name==="NotAllowedError"){ pending=[text,id]; showBlocked(); } else { curAudio=null; speakTTS(text,markDone); } });
    return; }
  speakTTS(text,markDone);
}
// Órdenes del profesor: pausar, reanudar, parar.
function applyCtl(c){
  const s=state&&P[state.stop];
  if(c.cmd==="pause"){ audioPaused=true; if(curAudio===AUD) AUD.pause(); else if(canSpeak) speechSynthesis.pause(); render(); }
  else if(c.cmd==="resume"){ audioPaused=false;
    if(curAudio===AUD){ const pr=AUD.play(); if(pr&&pr.catch) pr.catch(()=>{ if(s){ pending=[s.audio,s.id]; showBlocked(); } }); }
    else if(canSpeak) speechSynthesis.resume(); render(); }
  else if(c.cmd==="stop"){ stopAll(); audioDone=true; render(); }
}

// ---------- esquemas que muestra el profesor ----------
let esqDismissed=null;
function showEsq(){
  const e=state&&state.esq; let o=document.getElementById("esq");
  if(!e||String(e.seq)===esqDismissed||!esquema(e.id)){ if(o) o.remove(); return; }
  if(o && o.dataset.seq===String(e.seq)) return;
  if(o) o.remove();
  const x=esquema(e.id);
  o=document.createElement("div"); o.id="esq"; o.dataset.seq=String(e.seq);
  o.style.cssText="position:fixed;inset:0;z-index:60;background:#0a1324f5;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 0 calc(10px + env(safe-area-inset-bottom,0px))";
  o.innerHTML=`<div style="color:#fff;font:700 18px/1.2 var(--head);padding:6px 16px 8px;text-align:center">${esc(x.titulo)}</div>
    <div style="flex:1;overflow:auto;touch-action:pan-x pan-y pinch-zoom;display:flex;align-items:center"><img src="${x.img}" alt="${esc(x.titulo)}" style="width:max(100%,860px);display:block;background:#fff"></div>
    <p style="color:#9fb1d0;text-align:center;font-size:13px;margin:6px 16px 0">Desliza o haz zoom con dos dedos · gira el móvil para verlo mejor</p>
    <button id="esqx" type="button" class="btn ghost" style="margin:8px 16px 0;width:auto">Cerrar</button>`;
  document.body.appendChild(o);
  document.getElementById("esqx").onclick=()=>{ esqDismissed=String(e.seq); o.remove(); };
}

// ---------- arranque ----------
Store.on("claims",c=>{ claims=c||{}; if(!me||!me.av) renderJoin(); });
Store.on("state",s=>{ state=s; showEsq();
  if(s&&s.ctl){ if(lastCtlSeq!==null && s.ctl.seq!==lastCtlSeq) applyCtl(s.ctl); lastCtlSeq=s.ctl.seq; }
  render(); });
Store.on("players",p=>{ players=p||{};
  if(me && me.joined && !players[me.id]){ localStorage.removeItem(PKEY); me=null; return renderJoin(); }
  if(me&&players[me.id]){ $("hPts").hidden=false; $("hPts").textContent=players[me.id].score||0; }
  render(); });
if(me){ Store.on("answers",a=>{ myAnswers={}; Object.entries(a||{}).forEach(([k,v])=>{ if(v[me.id]) myAnswers[k]=v[me.id]; }); render(); });
        Store.on("duels",d=>{ duel=null; Object.entries(d||{}).forEach(([k,v])=>{ if(v && !v.resolved && (v.holder===me.id||v.challenger===me.id)) duel=Object.assign({key:k},v); }); render(); });
        setInterval(()=>Store.update("players/"+me.id,{last:Store.now()}),30000); Store.update("players/"+me.id,{last:Store.now()}); }
if(!me) renderJoin(); else render();

function headerWho(){ $("who").innerHTML = me&&me.av ? avSVG(me.av,30)+`<span>${esc(me.name)} · ${esc(avName(me.av))}</span>` : `<span>Visita al monasterio</span>`; }

// ---------- entrar: elegir avatar ----------
function avGrid(){
  const taken=new Set(Object.keys(claims));
  return `<div class="avpick" role="radiogroup" aria-label="Compositor o compositora">${ORDEN_COMPOSITORES.map(k=>`<button type="button" role="radio" aria-checked="${k===sel}" data-k="${k}" class="${taken.has(k)?"taken":""}" title="${esc(avName(k))}" aria-label="${esc(avName(k))}${taken.has(k)?", ya elegido: habrá duelo":""}">${avSVG(k,52)}${taken.has(k)?'<i class="lk">⚔️</i>':""}</button>`).join("")}</div>`;
}
function avCard(k){ const i=INFO_COMPOSITORES[k]||["",""]; return `<div class="avcard" id="avcard"><div class="av">${avSVG(k,74)}</div><div><b>${esc(avName(k))}</b><small>${esc(i[0])}</small><p>${esc(i[1])}</p></div></div>`; }
function renderJoin(){
  if(!sel) sel=ORDEN_COMPOSITORES[Math.floor(Math.random()*ORDEN_COMPOSITORES.length)];
  const nm=pendingName||($("nm")?$("nm").value:"");
  $("main").innerHTML=`<div class="card">
    <h1>Visita al CAAC 🎧</h1>
    <p class="muted" style="margin:0 0 12px">Escribe tu nombre y toca tu compositor o compositora. Si ya está cogido, podrás retar a un duelo.</p>
    <input id="nm" placeholder="Tu nombre" value="${esc(nm)}" maxlength="24" autocomplete="off">
    <label style="display:flex;gap:8px;align-items:center;margin:10px 2px 0;font-size:15px;color:var(--muted)"><input type="checkbox" id="doc" ${pendingDoc?"checked":""} style="width:auto"> 👩‍🏫 Soy docente: participo, pero no entro en el ranking</label>
    <h3>Elige tu compositor/a</h3>
    ${avGrid()}
    ${avCard(sel)}
    <button class="btn green" id="go">Entrar como ${esc(avName(sel))}</button>
    <p class="center" style="margin:12px 0 0"><a href="guia-estudio.pdf" target="_blank" style="color:var(--teal);font-weight:800">📘 Guía de estudio (PDF)</a></p>
    <div class="tip"><span>💡</span><span>Abre esta página en <b>Safari</b> o <b>Chrome</b> (no desde WhatsApp o Instagram) y ponte los auriculares. Al entrar se activa el sonido.</span></div>
    </div>`;
  $("nm").oninput=e=>pendingName=e.target.value; $("doc").onchange=e=>pendingDoc=e.target.checked;
  document.querySelectorAll(".avpick button").forEach(b=>b.onclick=()=>{ sel=b.dataset.k; document.querySelectorAll(".avpick button").forEach(x=>x.setAttribute("aria-checked",x===b)); $("avcard").outerHTML=avCard(sel); $("go").textContent="Entrar como "+avName(sel); });
  $("go").onclick=()=>join(sel);
}
async function join(k){
  const name=($("nm").value||"").trim(); if(!name) return U.alert("Escribe tu nombre");
  unlockAudio();
  const id=(me&&me.id)||U.id();
  const got=await Store.transaction("claims/"+k,cur=>cur?undefined:id);
  if(got===id){
    me={id,name,av:k,joined:true,docente:pendingDoc}; localStorage.setItem(PKEY,JSON.stringify(me));
    await Store.update("players/"+id,{name,docente:pendingDoc,av:k,composer:avName(k),score:(players[id]&&players[id].score)||0,joined:Store.now(),last:Store.now()});
    location.reload();
  } else {
    if(!await U.ask("«"+avName(k)+"» ya lo tiene otra persona. ¿Quieres retarle? Gana quien acierte antes.","⚔️ Retar")) return;
    me={id,name,av:null,joined:true,docente:pendingDoc}; localStorage.setItem(PKEY,JSON.stringify(me));
    await Store.update("players/"+id,{name,docente:pendingDoc,av:null,composer:null,score:(players[id]&&players[id].score)||0,joined:Store.now(),last:Store.now()});
    await Store.set("duels/"+k+"_"+id,{av:k,holder:got,challenger:id,qi:Math.floor(Math.random()*DUELO.length),winner:null,resolved:false,created:Store.now()});
    location.reload();
  }
}

// ---------- duelo ----------
function renderDuel(){
  headerWho();
  if(duel.winner) return resolveDuel();
  const q=DUELO[duel.qi], other=players[duel.holder===me.id?duel.challenger:duel.holder];
  $("main").innerHTML=`<div class="card"><div class="center">${avSVG(duel.av,84)}</div><h2 class="center">⚔️ Duelo por ${esc(avName(duel.av))}</h2>
    <p class="muted center">Contra <b>${esc(other?other.name:"…")}</b>. Quien acierte antes se lo queda.</p>
    <div class="q">${esc(q.q)}</div>
    <div class="opts">${q.opciones.map((o,k)=>`<button class="opt" style="background:${OCOL[k]}" data-k="${k}"><span class="sh">${SHAPES[k]}</span>${esc(o)}</button>`).join("")}</div>
    ${duel.challenger===me.id?`<button class="btn ghost" id="cancelDuel">Cancelar y elegir otro</button>`:""}</div>`;
  const cd=$("cancelDuel"); if(cd) cd.onclick=async()=>{ await Store.set("duels/"+duel.key,null); duel=null; render(); };
  document.querySelectorAll(".opt").forEach(b=>b.onclick=async()=>{
    document.querySelectorAll(".opt").forEach(x=>x.disabled=true);
    if(+b.dataset.k===q.correcta){ const w=await Store.transaction("duels/"+duel.key+"/winner",cur=>cur?undefined:me.id); b.classList.add(w===me.id?"ok":"bad"); }
    else { b.classList.add("bad"); setTimeout(()=>{ document.querySelectorAll(".opt").forEach(x=>x.disabled=false); b.classList.remove("bad"); },1500); }
  });
}
async function resolveDuel(){
  const won=duel.winner===me.id, k=duel.av;
  await Store.update("duels/"+duel.key,{resolved:true});
  if(won){
    await Store.set("claims/"+k,me.id); me.av=k; localStorage.setItem(PKEY,JSON.stringify(me));
    await Store.update("players/"+me.id,{av:k,composer:avName(k)});
    $("main").innerHTML=`<div class="card result"><div class="big">🏆</div><h2>¡Has ganado el duelo!</h2><p class="muted">${esc(avName(k))} es tuyo/a.</p></div>`;
  } else {
    if(duel.holder===me.id){ me.av=null; localStorage.setItem(PKEY,JSON.stringify(me)); await Store.update("players/"+me.id,{av:null,composer:null}); }
    $("main").innerHTML=`<div class="card result"><div class="big">😅</div><h2>Has perdido el duelo</h2><p class="muted">Elige otro compositor o compositora.</p></div>`;
  }
  setTimeout(()=>location.reload(),1800);
}

// ---------- vista principal ----------
function hero(s){ const pics=s.fotos&&s.fotos.length>1?`<div class="gal">${s.fotos.map(src=>`<img src="${src}" alt="" loading="lazy">`).join("")}</div>`:U.imgTag(s,""); return `<div class="hero">${pics}<div class="ov"></div><div class="tx"><span class="n">PARADA ${state.stop+1} DE ${P.length}${state.nom?" · PLANO "+esc(s.plano):""}</span><h2>${state.nom?esc(s.nombre):"📍 ¿Sabes dónde estamos?"}</h2></div></div>`; }
const lab=s=>state&&state.nom?s.nombre:"Parada "+(state.stop+1);
const hinted={}, answering={};
const mineKey=()=>{ if(!state||!P[state.stop]||state.phase!=="question") return ""; const k0=state.stop+"_"+state.q, m=myAnswers[k0]; return (m?("r"+m.choice):"n")+(hinted[k0]?"h":""); };
const rankSig=()=>Object.entries(players).filter(([,p])=>p.av).map(([id,p])=>id+":"+(p.score||0)+":"+JSON.stringify(p.by||0)).sort().join("|");
// Evita redibujar toda la pantalla cuando solo cambia algo que no se ve (latidos de otros alumnos): así el scroll y el audio no se interrumpen.
function render(){
  if(!me) return;
  const ph0=state?state.phase:"lobby";
  let sig;
  if(duel||!me.av) sig="x"+Math.random();
  else if(ph0==="lobby") sig="lobby|"+Object.entries(players).filter(([,p])=>p.av).map(([id])=>id).sort().join(",")+"|"+(state&&state.musica);
  else if(ph0==="stop"||ph0==="audio") sig=[ph0,state.stop,state.audioSeq,audioDone,audioPaused].join("|");
  else if(ph0==="question") sig=["q",state.stop,state.q,mineKey()].join("|");
  else sig=[ph0,state.stop,rankSig()].join("|");
  sig+="|"+(players[me.id]?"":"-")+"|"+(state&&state.nom?1:0);
  if(sig===lastSig && $("main").children.length) return;
  const phaseKey=ph0+":"+(state?state.stop:0)+":"+(state?state.q:0);
  const keep=(lastSig.split("|")[0]===sig.split("|")[0]) && (lastSig.split("|")[1]===sig.split("|")[1]);
  const y=window.scrollY; lastSig=sig;
  renderNow(phaseKey);
  if(keep) window.scrollTo(0,y); else window.scrollTo(0,0);
}
function renderNow(phaseKey){
  headerWho();
  $("mbtn").textContent=Music.muted?"🔇":"🎵"; $("mbtn").onclick=()=>{ Music.mute(!Music.muted); $("mbtn").textContent=Music.muted?"🔇":"🎵"; };
  if(duel){ Music.set(null); return renderDuel(); }
  if(!me.av){ Music.set(null); return renderJoin(); }
  const ph=state?state.phase:"lobby";
  Music.enabled(!(state&&state.musica===false));
  Music.set(ph==="lobby"?"espera":ph==="end"?"podium":null);
  if(phaseKey!==lastPhaseKey){ const first=lastPhaseKey===""; lastPhaseKey=phaseKey; if(!first && ph!=="audio") stopAll(); }
  if(!state||state.phase==="lobby"){
    const others=Object.values(players).filter(p=>p.av);
    $("main").innerHTML=`<div class="card center"><div class="big-av">${avSVG(me.av,120)}</div><h2>¡Dentro, ${esc(me.name)}!</h2><p class="muted">Espera a que el profesor empiece la visita. Ponte los auriculares.</p>
      <p class="muted" style="font-size:14px;margin:4px 0 0">🎵 Toca la pantalla una vez para activar la música y el sonido.</p>
      <button class="btn ghost" id="test">🔊 Probar el audio</button>
      <p class="muted" style="font-size:13px;margin:6px 0 0">Si no oyes nada: sube el volumen, quita el modo silencio y pulsa el botón.</p>
      <h3>Ya en la sala (${others.length})</h3><div class="roster">${others.map(p=>`<span title="${esc(p.name)}">${avSVG(p.av,34)}</span>`).join("")}</div>
      <p style="margin:12px 0 0"><a href="guia-estudio.pdf" target="_blank" style="color:var(--teal);font-weight:800">📘 Guía de estudio (PDF): repásala antes de empezar</a></p>
      <button class="btn ghost" id="swap" style="margin-top:14px;font-size:14px">↩ No soy yo / cambiar de persona</button></div>`;
    $("test").onclick=()=>{ unlockAudio(); stopAll(); const t="Hola "+me.name+", el audio funciona."; if(canSpeak) speakTTS(t); };
    $("swap").onclick=async()=>{ if(!await U.ask("¿Salir y entrar como otra persona?","Salir")) return; try{ await Store.set("claims/"+me.av,null); await Store.set("players/"+me.id,null); }catch(e){} localStorage.removeItem(PKEY); location.reload(); };
    return;
  }
  const s=P[state.stop]; if(!s) return;
  if(ph==="stop"||ph==="audio"){
    if(ph==="audio" && state.audioSeq!==lastAudioSeq){ lastAudioSeq=state.audioSeq; speak(s.audio,s.id); }
    const playing=ph==="audio"&&!audioDone;
    $("main").innerHTML=hero(s)+`<div class="card">
      ${ph==="audio"?(playing
          ?(audioPaused?`<p class="center" style="margin:10px 0 0;font:700 18px var(--head)">⏸ El profesor ha pausado el audio</p>`
                       :`<div class="wave"><i></i><i></i><i></i><i></i><i></i><i></i></div><p class="muted center" style="margin:0">Escucha con tus auriculares. Después habrá preguntas.</p>`)
          :`<p class="center" style="margin:10px 0 0;font:700 18px var(--head)">✅ Audio terminado</p><p class="muted center" style="margin:2px 0 0">Atento al profesor: ahora vienen las preguntas.</p>
            <button class="btn ghost" id="again">🔁 Volver a escuchar</button>`)
        +`<details class="txt" ${state.audioSeq>1?"open":""}><summary>📖 ¿No lo oyes? Léelo aquí</summary><p>${esc(s.audio)}</p></details>`
        :`<p class="muted center" style="margin:4px 0">📍 Estamos aquí. Escucha al profesor; enseguida sonará el audio en tu móvil.</p>`}</div>`;
    const a=$("again"); if(a) a.onclick=()=>{ unlockAudio(); speak(s.audio,s.id); render(); };
    return;
  }
  if(ph==="question"){
    const qs=qAll(s), q=qs[state.q], sur=state.q>=s.preguntas.length, key=state.stop+"_"+state.q, mine=myAnswers[key];
    if(!q) return;
    const order=perm(q.opciones.length,key+"|"+state.qStart);
    $("main").innerHTML=`<div class="card" style="margin-top:14px">
      <div class="muted" style="font-size:13px;font-weight:600">${sur?"🎲 Pregunta sorpresa · "+esc(lab(s)):esc(lab(s))+" · pregunta "+(state.q+1)+" de "+s.preguntas.length}</div>
      ${sur?"":`<div class="dots">${s.preguntas.map((_,k)=>`<i class="${k<state.q?"done":(k===state.q?"on":"")}"></i>`).join("")}</div>`}
      ${q.estudio?`<div class="study">${esc(E_ESTUDIO)}<br><small style="font-weight:700">⭐ Puntúa el doble (x${CONFIG.multEstudio||2})</small></div>`:""}
      <div class="q">${esc(q.q)}</div>
      ${mine?"":`<div class="timer"><i id="tbar" style="width:100%"></i></div><div class="muted center" id="tsec" style="margin:2px 0 0;font-weight:800">⏱ ${CONFIG.segundosRespuesta||30} s</div>`}
      ${(!mine&&q.pista)?(hinted[key]?`<div class="hint">💡 <b>Pista:</b> ${esc(q.pista)} <small>(si aciertas, −${CONFIG.penalizacionPista||300} pts)</small></div>`:`<button class="btn ghost" id="pista" type="button" style="margin-top:10px">💡 Ver pista (−${CONFIG.penalizacionPista||300} puntos)</button>`):""}
      <div class="opts">${order.map((k,d)=>`<button class="opt ${mine?(k===q.correcta?"ok":(mine.choice===k?"bad":"dim")):""}" style="background:${OCOL[d]}" data-k="${k}" ${mine?"disabled":""}><span class="sh">${SHAPES[d]}</span>${esc(q.opciones[k])}</button>`).join("")}</div>
      ${mine?resultHTML(mine):""}</div>`;
    if(!mine){
      const secs=CONFIG.segundosRespuesta||30; clearInterval(timerInt);
      const tick=()=>{ const el=$("tbar"); if(!el){clearInterval(timerInt);return;}
        const left=Math.max(0,secs*1000-(Store.now()-state.qStart)); el.style.width=(left/(secs*1000)*100)+"%"; const t=$("tsec"); if(t) t.textContent=left>0?("⏱ "+Math.ceil(left/1000)+" s"):"⏰ ¡Tiempo!";
        if(left<=0){ clearInterval(timerInt); answer(key,q,-1); } };
      tick(); timerInt=setInterval(tick,250);
      document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(key,q,+b.dataset.k));
      const pb=$("pista"); if(pb) pb.onclick=()=>{ hinted[key]=true; render(); };
    }
    return;
  }
  if(ph==="ranking"||ph==="end") return renderRanking(ph==="end");
}
function resultHTML(m){
  if(m.timeout) return `<div class="result"><div class="big no">⏰</div><p class="muted">¡Se acabó el tiempo! Espera a la siguiente pregunta…</p></div>`;
  const parts=[]; if(m.x2) parts.push("📚 x2 por no estar en el audio"); if(m.racha) parts.push("🔥 racha de "+m.racha+": +"+Math.round(((CONFIG.bonusRacha||1.3)-1)*100)+"%"); if(m.pen) parts.push("💡 pista: −"+m.pen);
  return `<div class="result"><div class="big ${m.correct?"ok":"no"}">${m.correct?"+"+m.points:"0"}</div><p class="muted">${m.correct?"¡Correcto! Espera a la siguiente pregunta…":"Esta vez no. Pierdes la racha. Espera a la siguiente pregunta…"}</p>${parts.length?`<p class="muted" style="font-size:13px;margin:4px 0 0">${parts.join(" · ")}</p>`:""}</div>`;
}
async function answer(key,q,k){
  if(myAnswers[key]||answering[key]) return; answering[key]=true;
  document.querySelectorAll(".opt").forEach(x=>x.disabled=true);
  const cfg=CONFIG, secs=cfg.segundosRespuesta||30, el=Store.now()-state.qStart;
  const timeout=k===-1||el>secs*1000+1500;
  const correct=!timeout&&k===q.correcta, used=!!hinted[key];
  const base=U.points(correct,el);
  const pen=(correct&&used)?Math.min(base,cfg.penalizacionPista||300):0;
  const mEst=(q.estudio&&correct)?(cfg.multEstudio||2):1;
  const ns=await Store.transaction("players/"+me.id+"/streak",cur=>correct?(cur||0)+1:0);
  const rachaOn=correct&&ns>=(cfg.rachaMin||3);
  const pts=correct?Math.round((base-pen)*mEst*(rachaOn?(cfg.bonusRacha||1.3):1)):0;
  await Store.set("answers/"+key+"/"+me.id,{choice:timeout?-1:k,correct,points:pts,t:Store.now(),hint:used,pen,x2:mEst>1,racha:rachaOn?ns:0,timeout});
  await Store.transaction("players/"+me.id+"/score",cur=>(cur||0)+pts);
  await Store.transaction("players/"+me.id+"/by/"+key.split("_")[0],cur=>(cur||0)+pts);
}
function renderRanking(final){
  const list=Object.entries(players).map(([id,p])=>Object.assign({id},p)).filter(p=>p.av&&!p.docente);
  const sortedL=list.slice().sort((a,b)=>(b.score||0)-(a.score||0)||String(a.name).localeCompare(String(b.name)));
  const pos=sortedL.findIndex(p=>p.id===me.id)+1;
  if(final){
    $("main").innerHTML=podiumView(list,me.id);
    podiumReveal($("main"));
  } else {
    $("main").innerHTML=rankBoard(list,{stop:state.stop,meId:me.id,title:"🏆 Marcador",
      sub:(me.docente?`Participas fuera de concurso 👩‍🏫`:`Vas <b>${pos}º</b> de ${list.length}`)+` · ${esc(lab(P[state.stop]))}`,note:"Espera a que el profesor active la siguiente parada."});
    rankAnimate($("main"));
  }
}
</script>
</body>
